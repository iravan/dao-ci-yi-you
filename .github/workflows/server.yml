name: Server

on:
  push:
    branches: [main]
    paths:
      - server/**
      - .github/workflows/server.yml
  pull_request:
    paths:
      - server/**
      - .github/workflows/server.yml

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
        working-directory: server
      - run: cargo test
        working-directory: server

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          load: true
          tags: server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Publish this image to your host's registry and deploy it from the
      # production job, for example:
      #   Fly.io      flyctl deploy --image server
      #   Railway     railway up
      #   Render      a Docker service pointed at the image, or a deploy hook
      # Every host needs REDIS_URL, CORS_ORIGINS, and optionally SUPABASE_URL
      # (the JWKS address is derived from it) or SUPABASE_JWKS_URL.
